<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부천나눔 - 편집</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="bg-light">

	<div class="container py-5">
		<div class="row justify-content-center">
			<div class="col-lg-6">
				<div class="card form-card shadow-sm">
					<div class="card-header text-center">
						<h3 class="fw-bold text-primary-bcn mb-1">데이터 편집</h3>
						<p class="small text-muted mb-0">입력된 정보를 다시 한번 확인해 주세요.</p>
					</div>
					<div class="card-body p-5">
						<form th:action="@{/data/update}" method="post">
							<input type="hidden" name="dataNo" th:value="${data.dataNo}">

							<div class="mb-4">
								<label class="form-label">항목 내용</label> <input type="text"
									name="testString" class="form-control"
									th:value="${data.testString}" placeholder="내용을 입력하세요" required>
							</div>

							<div class="d-grid gap-2">
								<button type="submit" class="btn btn-primary-bcn btn-lg fw-bold">저장하기</button>
								<a th:href="@{/data/result}" class="btn btn-link text-muted">취소하고
									돌아가기</a>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

</body>
</html>
