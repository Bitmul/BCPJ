<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부천나눔 - 목록</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="bg-light">

	<div class="container py-5">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<div>
				<h2 class="fw-bold text-primary-bcn">데이터 현황</h2>
				<p class="text-muted mb-0">현재 등록된 소중한 정보들을 확인하실 수 있습니다.</p>
			</div>
			<a th:href="@{/data/register}"
				class="btn btn-primary-bcn btn-action shadow-sm"> <i
				class="bi bi-plus-lg"></i> 새 데이터 등록
			</a>
		</div>

		<div class="bcn-table-container">
			<table class="table table-hover align-middle">
				<thead>
					<tr>
						<th style="width: 15%">번호</th>
						<th style="width: 55%">내용</th>
						<th style="width: 30%" class="text-center">관리</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="d : ${dataList}">
						<td class="fw-bold text-secondary" th:text="${d.dataNo}">1</td>
						<td th:text="${d.testString}">데이터 내용이 출력되는 공간입니다.</td>
						<td class="text-center"><a
							th:href="@{/data/modify(dataNo=${d.dataNo})}"
							class="btn btn-sm btn-outline-primary btn-action me-2">수정</a> <a
							th:href="@{/data/delete(dataNo=${d.dataNo})}"
							class="btn btn-sm btn-outline-danger btn-action"
							onclick="return confirm('정말로 삭제하시겠습니까?')">삭제</a></td>
					</tr>
					<tr th:if="${dataList.isEmpty()}">
						<td colspan="3" class="text-center py-5 text-muted">등록된 데이터가
							없습니다.</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
